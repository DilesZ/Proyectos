<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orquestador • Panel Gamificado</title>
  <link rel="stylesheet" href="styles.css?v=3.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Carga de datos para evitar problemas CORS -->
  <script src="data/tasks.json" type="application/json" id="tasksData"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🐉</div>
        <div class="brand-text">
          <h1>DilesZ AI</h1>
          <span>Z-Rank Execution System</span>
        </div>
      </div>
      
      <div class="nav-menu" id="businessTabs">
        <!-- Navigation items will be injected here -->
      </div>

      <div class="user-stats">
        <div class="stat-row">
          <span>Puntos Totales</span>
          <span class="stat-value" id="totalPoints">0</span>
        </div>
        <div class="stat-row">
          <span>Progreso</span>
          <span class="stat-value"><span id="totalCompleted">0</span>/<span id="totalTasks">0</span></span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <h2 class="page-title" id="currentViewTitle">Dashboard</h2>
        <div class="actions">
          <a href="guide.html" target="_blank" class="btn btn-primary" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; background-color: #238636; color: white; padding: 0.5rem 1rem; border-radius: 6px; margin-right: 10px; font-weight: 500;">
            <span>📖</span> Abrir Guía Maestra
          </a>
          <button id="resetProgress" class="btn btn-secondary">
            <span>↺</span> Reiniciar
          </button>
        </div>
      </header>

      <div class="scroll-area" id="content">
        <!-- Content will be injected here -->
      </div>
    </main>
  </div>

  <!-- Detail View Slide-over -->
  <div id="detailOverlay" class="detail-overlay" aria-hidden="true"></div>
  <div id="detailView" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true" tabindex="-1">
    <header class="detail-header">
      <h2 id="detailTitle" style="margin:0; font-size:1.25rem;">Detalle</h2>
      <button id="closeDetail" class="btn btn-secondary" aria-label="Cerrar detalle" style="padding:0.25rem 0.5rem;">✕</button>
    </header>
    <div class="detail-content">
      <div class="detail-meta-container" style="display:flex; gap:0.5rem; margin-bottom:1rem;">
          <span id="detailBadge" class="badge hidden"></span>
          <span id="detailTime" class="badge hidden"></span>
          <span id="detailDiff" class="badge hidden"></span>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <script src="app.js?v=3.0"></script>
</body>
</html>
